name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_API_SIGN_SECRET: ${{ vars.VITE_API_SIGN_SECRET }}
          VITE_STATIC_MODE: "false"
        run: npm run build

      - name: Scan dist for leaked secrets
        run: |
          set -e
          if find dist -name '*.map' | grep -q .; then
            echo "Source map files must not be published"
            exit 1
          fi
          if grep -R -E 'sourceMappingURL|dev-token|AKID[A-Za-z0-9]{10,}|SECRET_KEY|BEGIN PRIVATE KEY' dist/; then
            echo "Sensitive pattern found in dist/"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload COS deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache-dependency-path: backend/go.sum

      - name: Test backend
        run: go test ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, backend-quality]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cos:
    runs-on: ubuntu-latest
    needs: [build, backend-quality]
    concurrency:
      group: "cos-production"
      cancel-in-progress: false
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tencent COS SDK
        run: python -m pip install --disable-pip-version-check cos-python-sdk-v5==1.9.44

      - name: Deploy website to COS
        env:
          COS_BUCKET: v1site-1311844229
          COS_REGION: ap-guangzhou
          COS_SECRET_ID: ${{ secrets.COS_DEPLOY_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_DEPLOY_SECRET_KEY }}
        run: python scripts/deploy_cos.py --dist dist
